# Dispara el cron de alertas cada hora (Vercel Hobby solo permite 1 vez por día).
# Configurar en el repo (Settings → Secrets and variables → Actions):
#   APP_URL      = https://tu-app.vercel.app
#   CRON_SECRET  = el mismo valor que CRON_SECRET del entorno de la app
name: cron-alerts
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Faltan secrets APP_URL/CRON_SECRET"; exit 0; fi
          curl --fail --silent --show-error -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/alerts"
